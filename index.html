<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NCERT Notes + MCQ</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        .header {
            text-align: center;
            background: #2563eb;
            color: white;
            padding: 50px 20px;
            border-radius: 18px;
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;
            font-size: 38px;
        }

        .header p {
            margin-top: 12px;
            font-size: 18px;
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
        }

        .subject-card h2 {
            margin-top: 0;
            color: #2563eb;
        }

        .subject-card p {
            color: #6b7280;
        }

        .subject-card a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .subject-card a:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            color: #6b7280;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>📚 NCERT Notes + MCQ</h1>

            <p>NCERT आधारित Notes और MCQ Practice</p>

        </div>


        <div class="subjects">

            <div class="subject-card">

                <h2>🔬 General Science</h2>

                <p>
                    Physics, Chemistry, Biology और Environmental Science
                </p>

                <a href="General-Science/index.html">
                    Open General Science
                </a>

            </div>

        </div>


        <div class="footer">

            © NCERT Notes + MCQ

        </div>

    </div>

</body>

</html>
