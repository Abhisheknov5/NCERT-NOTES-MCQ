<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>गति एवं दूरियों का मापन | MCQ Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#172b4d;line-height:1.6}
.container{max-width:1100px;margin:auto;padding:24px 20px}
.card{background:#fff;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
.hidden{display:none!important}
h1,h2,h3{margin-top:0}
button,select{font:inherit}
button{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.home{padding:28px}
.home h1{font-size:32px;margin-bottom:6px}
.sub{color:#536579;font-size:18px}
.section{border:1px solid #d4dae2;border-radius:12px;padding:17px 20px;margin:12px 0;cursor:pointer;background:#fafbfc}
.section:hover{background:#f5f8fc}
.section-title{font-size:20px;font-weight:700;color:#111}
.section-count{color:#536579}
.setup{padding:28px}
.question-select-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.question-select-row label{font-size:18px;white-space:nowrap}
.back{display:inline-block;color:#2563eb;text-decoration:none;font-weight:700;margin-bottom:18px}
select{padding:10px 14px;border:1px solid #ccc;border-radius:8px;margin-left:8px}
.next{background:#16a34a;color:#fff}
.prev{background:#6b7280;color:#fff}
.submit{background:#2563eb;color:#fff}
.quiz-topbar{margin:0 0 14px}
.topics-back{padding:12px 18px;border:1px solid #d1d5db;border-radius:10px;background:#f5f5f5;color:#111827;font-size:16px;cursor:pointer}
.topics-back:hover{background:#e5e7eb}
.quiz-header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.quiz-header strong{font-size:18px}
.question-card{padding:26px;margin-bottom:18px}
.question{font-size:22px;font-weight:700;margin-bottom:20px;white-space:pre-line}
.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:2px solid #e1e5ea;background:#fff;border-radius:10px}
.option:hover{border-color:#2563eb;background:#eff6ff}
.option.selected{border-color:#2563eb;background:#dbeafe}
.option.correct{border-color:#16a34a;background:#dcfce7}
.option.wrong{border-color:#dc2626;background:#fee2e2}
.feedback{min-height:28px;font-weight:700;margin-top:12px}
.explanation{margin-top:14px;padding:16px 18px;border-left:5px solid #2563eb;border-radius:10px;background:#eff6ff;color:#172b4d;font-size:16px;line-height:1.65}
.explanation-title{font-weight:700;font-size:18px;margin-bottom:6px}
.bottom{padding:18px 24px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
.palette{padding:20px 24px}
.pal-grid{display:flex;flex-wrap:wrap;gap:8px}
.pal{background:#fff;border:1px solid #d4dae2;width:58px;min-width:58px;height:52px;padding:8px 4px}
.pal.active{outline:3px solid #2563eb}
.pal.done{background:#dbeafe}
.result{padding:32px;text-align:center}
.stat{font-size:18px;line-height:2}
.review-card{margin-top:16px;padding:22px;text-align:left}
.review-q{font-size:20px;font-weight:700}
.review-option{padding:10px 12px;margin:7px 0;border-radius:8px;border:1px solid #ddd}
.review-option.correct{background:#dcfce7;border-color:#16a34a}
.review-option.wrong{background:#fee2e2;border-color:#dc2626}
@media(max-width:650px){
.container{padding:14px}
.home h1{font-size:26px}
.question{font-size:19px}
.quiz-header,.bottom{flex-direction:column;align-items:stretch}
.bottom button{margin:4px 0}
.pal{width:50px;min-width:50px;height:48px}
}
</style>
</head>
<body>
<div class="container">
<div id="home" class="card home">
<h1>📚 गति एवं दूरियों का मापन MCQ Practice</h1>
<div class="sub">Class 6 Physics • 150 MCQs • 5 Sections</div>
<div id="sectionsList"></div>
</div>

<div id="setup" class="card setup hidden">
<a href="#" class="back" onclick="goHome();return false;">← Back to Sections</a>
<h2 id="setupTitle"></h2>
<p class="sub" id="setupInfo"></p>
<div class="question-select-row">
<label><b>Questions:</b></label>
<select id="questionCount"></select>
</div>
<br><br>
<button class="next" onclick="startPractice()">🚀 Start Practice</button>
</div>

<div id="quiz" class="hidden">
<div class="quiz-topbar">
<button class="topics-back" onclick="goHome()">← Topics</button>
</div>
<div class="card quiz-header">
<strong id="sectionName"></strong>
<div id="counter"></div>
<div id="attempted"></div>
</div>

<div class="card question-card">
<div class="question" id="question"></div>
<div id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="explanation hidden" id="explanation"></div>
</div>

<div class="card bottom">
<div>
<button class="prev" id="prevBtn">← Previous</button>
<button class="submit" id="checkBtn">Check Answer</button>
<button class="next" id="nextBtn">Next →</button>
</div>
<button class="submit" id="submitBtn">Submit Test</button>
</div>

<div class="card palette">
<h3>Question Palette</h3>
<div class="pal-grid" id="palette"></div>
</div>
</div>

<div id="result" class="card result hidden">
<h2>🎯 Test Result</h2>
<div class="stat" id="resultText"></div>
<br>
<button class="next" id="reviewBtn">👁️ Review Answers</button>
<button class="prev" id="homeBtn">Choose Section</button>
</div>
</div>

<script>
const questions=[{"id":1,"q":"प्राचीन काल में लोग एक स्थान से दूसरे स्थान तक जाने के लिए मुख्यतः किसका उपयोग करते थे?","options":["पैदल चलना","रेलगाड़ी","वायुयान","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"परिवहन के आधुनिक साधनों के विकास से पहले लोग मुख्यतः पैदल यात्रा करते थे। NCERT में परिवहन के साधनों के क्रमिक विकास का वर्णन किया गया है।"},{"id":2,"q":"प्राचीन समय में सामान ले जाने के लिए किसका उपयोग किया जाता था?","options":["पशुओं का","वायुयान का","मोटर कार का","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पुराने समय में मनुष्य सामान और यात्रियों को ले जाने के लिए पशुओं का उपयोग करते थे। बाद में पहिए वाली गाड़ियों का विकास हुआ।"},{"id":3,"q":"जल मार्ग से यात्रा करने के लिए किस साधन का उपयोग किया जाता था?","options":["नाव","रेलगाड़ी","बस","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"जल मार्ग पर यात्रा के लिए नाव जैसे जल परिवहन साधनों का उपयोग किया जाता है। परिवहन के साधन स्थान की प्रकृति के अनुसार चुने जाते हैं।"},{"id":4,"q":"प्रारम्भिक नावें किससे बनाई जाती थीं?","options":["लकड़ी के लट्ठों से","प्लास्टिक से","काँच से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अध्याय में प्रारम्भिक नावों के निर्माण के लिए लकड़ी के लट्ठों के उपयोग का उल्लेख है।"},{"id":5,"q":"परिवहन के विकास में किस आविष्कार का बहुत महत्त्व रहा?","options":["पहिया","थर्मामीटर","माइक्रोस्कोप","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पहिए के आविष्कार ने परिवहन को अधिक सुविधाजनक बनाया और पहिए वाली गाड़ियों का विकास संभव हुआ।"},{"id":6,"q":"पहिए वाली गाड़ियों को खींचने के लिए किसका उपयोग किया जाता था?","options":["पशुओं का","वायुयान का","नाव का","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पहिए वाली गाड़ियों को चलाने के लिए पशुओं का उपयोग किया जाता था। यह परिवहन के पुराने साधनों का एक चरण था।"},{"id":7,"q":"परिवहन के नए साधनों के विकास में किस इंजन का महत्त्व था?","options":["वाष्प-इंजन","केवल बैटरी","पवनचक्की","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"वाष्प-इंजन के विकास ने परिवहन के नए साधनों के विकास को गति दी और रेल परिवहन के विकास में योगदान किया।"},{"id":8,"q":"वाष्प-इंजन से चलने वाली रेलगाड़ियों के लिए क्या आवश्यक हुआ?","options":["रेल की पटरियाँ","नदी","समुद्र","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"रेलगाड़ियों के संचालन के लिए रेल की पटरियाँ बनाई गईं। इससे स्थल परिवहन में बड़ा परिवर्तन आया।"},{"id":9,"q":"निम्न में से कौन स्वचालित वाहन हैं?","options":["मोटर कार","ट्रक","बस","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"मोटर कार, ट्रक और बस सभी मोटर से चलने वाले स्वचालित परिवहन साधनों के उदाहरण हैं। इसलिए एक से अधिक विकल्प सही हैं।"},{"id":10,"q":"मोटर से चलने वाले जल परिवहन साधनों में क्या शामिल है?","options":["मोटर नाव और जहाज","केवल बैलगाड़ी","केवल साइकिल","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"जल परिवहन में मोटर से चलने वाली नावों और जहाजों का विकास हुआ, जिससे जल मार्ग से यात्रा अधिक सुविधाजनक हुई।"},{"id":11,"q":"वायुयान का विकास किस शताब्दी के प्रारम्भिक वर्षों में हुआ?","options":["सत्रहवीं शताब्दी","बीसवीं शताब्दी","पंद्रहवीं शताब्दी","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"NCERT में वायुयान के विकास को बीसवीं शताब्दी के प्रारम्भिक वर्षों से जोड़ा गया है।"},{"id":12,"q":"आधुनिक परिवहन के विकास में निम्न में से कौन शामिल हैं?","options":["विद्युत रेलगाड़ी","एकल-रेल (Monorail)","अंतरिक्षयान","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"अध्याय आधुनिक परिवहन के उदाहरणों में विद्युत रेलगाड़ी, एकल-रेल तथा अंतरिक्षयान जैसे साधनों का उल्लेख करता है।"},{"id":13,"q":"Monorail में कितनी मुख्य रेल-पटरी होती है?","options":["एक","दो","तीन","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"“Mono” का अर्थ एक होता है और Monorail एक रेल-पटरी पर चलने वाली प्रणाली है।"},{"id":14,"q":"बहुत लंबी दूरी को मापने के लिए कौन-सी इकाई सुविधाजनक है?","options":["किलोमीटर","मिलीमीटर","सेंटीमीटर","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बहुत लंबी दूरियों के लिए मीटर की अपेक्षा किलोमीटर अधिक सुविधाजनक है। NCERT में किलोमीटर को लंबी दूरियों के लिए बड़ी इकाई बताया गया है।"},{"id":15,"q":"लंबाई की SI इकाई क्या है?","options":["सेंटीमीटर","मीटर","किलोमीटर","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"अंतरराष्ट्रीय मात्रक प्रणाली (SI) में लंबाई का मानक मात्रक मीटर है।"},{"id":16,"q":"1 मीटर में कितने सेंटीमीटर होते हैं?","options":["10","100","1000","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"NCERT के अनुसार एक मीटर को 100 बराबर भागों में बाँटने पर प्रत्येक भाग एक सेंटीमीटर होता है। अतः 1 m = 100 cm."},{"id":17,"q":"1 सेंटीमीटर में कितने मिलीमीटर होते हैं?","options":["1","10","100","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"एक सेंटीमीटर को 10 बराबर भागों में बाँटने पर प्रत्येक भाग मिलीमीटर होता है। इसलिए 1 cm = 10 mm."},{"id":18,"q":"1 किलोमीटर में कितने मीटर होते हैं?","options":["100","1000","10","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"NCERT में स्पष्ट रूप से 1 km = 1000 m दिया गया है।"},{"id":19,"q":"मापन का मूल अर्थ क्या है?","options":["अज्ञात मात्रा की ज्ञात मात्रा से तुलना","केवल अनुमान लगाना","वस्तु को देखना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"किसी अज्ञात लंबाई या राशि को ज्ञात मानक से तुलना करके उसका मापन किया जाता है। इसी कारण मानक मात्रक आवश्यक हैं।"},{"id":20,"q":"मापन के लिए ज्ञात और निश्चित मात्रा को क्या कहा जाता है?","options":["मात्रक","अनुमान","दूरी","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"मापन में जिस ज्ञात निश्चित मात्रा से तुलना की जाती है, उस s":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"तीनों कथन वस्तु की प्रकृति के अनुसार उपयुक्त मापन युक्ति के चयन को दर्शाते हैं।"},{"id":99,"q":"1. समय के साथ स्थिति में परिवर्तन गति कहलाता है।\n2. स्थिति में परिवर्तन को दूरी-मापन से जाना जा सकता है।\n3. गति का स्थिति से कोई संबंध नहीं है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"गति की पहचान वस्तु की स्थिति में समय के साथ होने वाले परिवर्तन से होती है। NCERT इसी परिवर्तन को दूरी के माध्यम से जानने की बात करता है।"},{"id":100,"q":"1. झूले की गति आवर्ती हो सकती है।\n2. शाखाओं का लहराना आवर्ती गति का उदाहरण दिया गया है।\n3. सिलाई मशीन की सुई आवर्ती गति करती है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"तीनों उदाहरणों में गति किसी रूप में दोहराई जाती है, इसलिए इन्हें आवर्ती गति के उदाहरणों के रूप में समझा जाता है।"},{"id":101,"q":"1. पंखे की पंखुड़ी वर्तुल गति करती है।\n2. घड़ी की सुई वर्तुल गति करती है।\n3. धागे से घूमता पत्थर वर्तुल गति का उदाहरण है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"तीनों में वस्तु किसी केंद्र या निश्चित बिंदु के चारों ओर वृत्तीय पथ पर घूमती है, इसलिए ये वर्तुल गति के उदाहरण हैं।"},{"id":102,"q":"1. 1 km = 1000 m.\n2. 1 m = 100 cm.\n3. 1 cm = 10 mm.","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"तीनों मात्रक-संबंध NCERT में स्पष्ट रूप से दिए गए हैं।"},{"id":103,"q":"1. SI मात्रक अंतरराष्ट्रीय स्तर पर मान्य मापन प्रणाली है।\n2. लंबाई की SI इकाई मीटर है।\n3. SI मात्रक केवल भारत में मान्य हैं।", const sections=[{"name":"Section A — Basic / Direct NCERT Questions","start":1,"end":35},{"name":"Section B — Concept Based Questions","start":36,"end":70},{"name":"Section C — Statement Based Questions","start":71,"end":105},{"name":"Section D — Assertion–Reason Questions","start":106,"end":125},{"name":"Section E — Case / Scenario Based Questions","start":126,"end":150}];

let selectedSection=null;
let quiz=[];
let currentIndex=0;
let answers={};
let checked={};
let reviewMode=false;

function goHome(){
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 selectedSection=null;quiz=[];currentIndex=0;answers={};checked={};reviewMode=false;
 window.scrollTo(0,0);
}

function renderSections(){
 const box=document.getElementById("sectionsList");
 box.innerHTML="";
 sections.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="section";
  d.innerHTML=`<div class="section-title">${s.name}</div><div class="section-count">${s.end-s.start+1} Questions</div>`;
  d.onclick=()=>startSection(i);
  box.appendChild(d);
 });
}

function startSection(i){
 selectedSection=sections[i];
 const list=questions.slice(selectedSection.start-1,selectedSection.end);
 document.getElementById("home").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("setup").classList.remove("hidden");

 document.getElementById("setupTitle").textContent=selectedSection.name;
 document.getElementById("setupInfo").textContent=`${list.length} MCQs available`;

 const sel=document.getElementById("questionCount");
 sel.innerHTML="";
 [5,10,20,list.length].forEach(n=>{
  if(n<=list.length && !Array.from(sel.options).some(o=>Number(o.value)===n)){
   const o=document.createElement("option");
   o.value=n;
   o.textContent=n===list.length?`All ${n} Questions`:`${n} Questions`;
   sel.appendChild(o);
  }
 });
 // IMPORTANT: default हमेशा पूरे section की question count रहेगी
 sel.value=String(list.length);
 window.scrollTo(0,0);
}

function startPractice(){
 const list=questions.slice(selectedSection.start-1,selectedSection.end)
   .map((q,i)=>({...q,_id:selectedSection.start+i}));
 const count=Number(document.getElementById("questionCount").value);

 quiz=list.slice(0,count);
 currentIndex=0;
 answers={};
 checked={};
 reviewMode=false;

 document.getElementById("setup").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo(0,0);
}

function render(){
 const q=quiz[currentIndex];
 if(!q)return;

 document.getElementById("sectionName").textContent=selectedSection.name;
 document.getElementById("counter").textContent=`Question ${currentIndex+1} of ${quiz.length}`;
 document.getElementById("attempted").textContent=`Attempted: ${Object.keys(answers).length}/${quiz.length}`;
 document.getElementById("question").textContent=`Q${q._id}. ${q.q}`;

 const box=document.getElementById("options");
 box.innerHTML="";
 document.getElementById("feedback").textContent="";
 document.getElementById("explanation").classList.add("hidden");
 document.getElementById("explanation").innerHTML="";

 q.options.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="option";
  b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${opt}`;

  const selected=answers[q._id];
  if(selected===i)b.classList.add("selected");

  if(checked[q._id] || reviewMode){
   b.disabled=true;
   if(i===q.answer)b.classList.add("correct");
   if(selected===i && i!==q.answer)b.classList.add("wrong");
  }else{
   b.onclick=()=>{
    answers[q._id]=i;
    render();
   };
  }
  box.appendChild(b);
 });

 if(checked[q._id] || reviewMode){
  const f=document.getElementById("feedback");
  if(selectedAnswerExists(q)){
   f.textContent=answers[q._id]===q.answer
     ?"✅ सही उत्तर!"
     :`❌ गलत। सही उत्तर: ${String.fromCharCode(65+q.answer)}`;
   f.style.color=answers[q._id]===q.answer?"#15803d":"#b91c1c";
  }else{
   f.textContent=`⚪ Unattempted. सही उत्तर: ${String.fromCharCode(65+q.answer)}`;
   f.style.color="#536579";
  }

  document.getElementById("explanation").innerHTML=
    `<div class="explanation-title">💡 Explanation</div>${formatExplanation(q.explanation)}`;
  document.getElementById("explanation").classList.remove("hidden");
 }

 renderPalette();
 document.getElementById("prevBtn").disabled=currentIndex===0;
 document.getElementById("nextBtn").disabled=currentIndex===quiz.length-1;
 document.getElementById("checkBtn").disabled=reviewMode || !!checked[q._id] || answers[q._id]===undefined;
 document.getElementById("submitBtn").style.display=reviewMode?"none":"inline-block";
}

function selectedAnswerExists(q){
 return answers[q._id]!==undefined;
}

function formatExplanation(s){
 return s.replace(/\n/g,"<br>");
}

function renderPalette(){
 const p=document.getElementById("palette");
 p.innerHTML="<h3>Question Palette</h3>";
 const g=document.createElement("div");
 g.className="pal-grid";

 quiz.forEach((q,i)=>{
  const b=document.createElement("button");
  b.className="pal";
  b.type="button";
  b.textContent=q._id;
  if(i===currentIndex)b.classList.add("active");
  if(answers[q._id]!==undefined)b.classList.add("done");
  b.onclick=()=>{
   currentIndex=i;
   render();
   window.scrollTo(0,0);
  };
  g.appendChild(b);
 });
 p.appendChild(g);
}

document.getElementById("prevBtn").onclick=()=>{
 if(currentIndex>0){
  currentIndex--;
  render();
  window.scrollTo(0,0);
 }
};

document.getElementById("nextBtn").onclick=()=>{
 if(currentIndex<quiz.length-1){
  currentIndex++;
  render();
  window.scrollTo(0,0);
 }
};

document.getElementById("checkBtn").onclick=()=>{
 const q=quiz[currentIndex];
 if(answers[q._id]===undefined)return;
 checked[q._id]=true;
 render();
};

document.getElementById("submitBtn").onclick=()=>{
 if(confirm("क्या आप अपना test submit करना चाहते हैं?"))showResult();
};

function showResult(){
 let correct=0,attempted=Object.keys(answers).length;
 quiz.forEach(q=>{
  if(answers[q._id]===q.answer)correct++;
 });
 let wrong=Object.keys(answers).filter(id=>{
  const q=quiz.find(x=>String(x._id)===String(id));
  return q && answers[id]!==q.answer;
 }).length;

 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("resultText").innerHTML=
 `<div><b>Score:</b> ${correct} / ${quiz.length}</div>
  <div>🟢 Correct: ${correct}</div>
  <div>🔴 Wrong: ${wrong}</div>
  <div>⚪ Unattempted: ${quiz.length-attempted}</div>
  <div>📊 Attempted: ${attempted}</div>`;

 window.scrollTo(0,0);
}

document.getElementById("reviewBtn").onclick=()=>{
 reviewMode=true;
 currentIndex=0;
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo(0,0);
};

// Keyboard shortcuts for Review Answers
document.addEventListener("keydown", (e)=>{
 if(!reviewMode) return;

 // Don't trigger shortcuts while typing in an input/textarea/select
 const tag = document.activeElement?.tagName;
 if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

 const key = e.key.toLowerCase();

 if(key === "n" && currentIndex < quiz.length - 1){
   e.preventDefault();
   currentIndex++;
   render();
   window.scrollTo(0,0);
 }

 if(key === "p" && currentIndex > 0){
   e.preventDefault();
   currentIndex--;
   render();
   window.scrollTo(0,0);
 }
});

document.getElementById("homeBtn").onclick=goHome;

renderSections();
</script>
</body>
</html>
