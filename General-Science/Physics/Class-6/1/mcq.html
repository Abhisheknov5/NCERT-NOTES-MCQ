<script>
let selectedSection = null;
let quiz = [];
let currentIndex = 0;
let answers = {};
let reviewMode = false;

const sections = [
    {
        name: "Section A — Basic / Direct NCERT Questions",
        start: 1,
        end: 35
    },
    {
        name: "Section B — Concept Based Questions",
        start: 36,
        end: 70
    },
    {
        name: "Section C — Statement Based Questions",
        start: 71,
        end: 105
    },
    {
        name: "Section D — Assertion–Reason Questions",
        start: 106,
        end: 125
    },
    {
        name: "Section E — Case / Scenario Based Questions",
        start: 126,
        end: 150
    }
];


/* =========================
   HOME
========================= */

function goHome() {

    document.getElementById("home").classList.remove("hidden");
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");

    selectedSection = null;
    quiz = [];
    currentIndex = 0;
    answers = {};
    reviewMode = false;

    location.reload();
}


/* =========================
   START SECTION
========================= */

function startSection(sectionIndex) {

    selectedSection = sections[sectionIndex];

    const sectionQuestions = questions.filter(q =>
        q.id >= selectedSection.start &&
        q.id <= selectedSection.end
    );

    showSetup(sectionQuestions);
}


/* =========================
   SETUP
========================= */

function showSetup(sectionQuestions) {

    const home = document.getElementById("home");

    home.innerHTML = `
        <div style="margin-bottom:20px;">
            <button
                class="prev"
                onclick="location.reload()">
                ← Back
            </button>
        </div>

        <h1>${selectedSection.name}</h1>

        <p class="sub">
            ${sectionQuestions.length} MCQs available
        </p>

        <div class="card" style="
            padding:24px;
            margin-top:20px;
        ">

            <label style="
                font-size:18px;
                font-weight:700;
            ">
                Questions:
            </label>

            <select
                id="questionCount"
                style="
                    margin-left:10px;
                    padding:10px 14px;
                    border:1px solid #ccc;
                    border-radius:8px;
                    font-size:16px;
                "
            >
                <option value="10">
                    10 Questions
                </option>

                <option value="20">
                    20 Questions
                </option>

                <option value="${sectionQuestions.length}">
                    All ${sectionQuestions.length} Questions
                </option>
            </select>

            <br><br>

            <button
                class="next"
                onclick="startPractice()">
                🚀 Start Practice
            </button>

        </div>
    `;
}


/* =========================
   START PRACTICE
========================= */

function startPractice() {

    const sectionQuestions = questions.filter(q =>
        q.id >= selectedSection.start &&
        q.id <= selectedSection.end
    );

    const count =
        parseInt(
            document.getElementById("questionCount").value
        );

    quiz = shuffle(sectionQuestions).slice(0, count);

    currentIndex = 0;
    answers = {};
    reviewMode = false;

    document.getElementById("home")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    renderQuestion();
}


/* =========================
   SHUFFLE
========================= */

function shuffle(array) {

    return [...array].sort(
        () => Math.random() - 0.5
    );
}


/* =========================
   RENDER QUESTION
========================= */

function renderQuestion() {

    const q = quiz[currentIndex];

    if (!q) return;


    document.getElementById("sectionName")
        .textContent = selectedSection.name;


    document.getElementById("counter")
        .textContent =
        `Question ${currentIndex + 1} of ${quiz.length}`;


    document.getElementById("attempted")
        .textContent =
        `Attempted: ${Object.keys(answers).length}/${quiz.length}`;


    document.getElementById("question")
        .textContent = q.q;


    const optionsBox =
        document.getElementById("options");

    optionsBox.innerHTML = "";


    q.options.forEach((option, index) => {

        const button =
            document.createElement("button");

        button.className = "option";


        const letter =
            String.fromCharCode(65 + index);


        button.textContent =
            `${letter}) ${option}`;


        /* Selected */

        if (
            answers[q.id] !== undefined &&
            answers[q.id] === index
        ) {
            button.classList.add("selected");
        }


        /* Review */

        if (reviewMode) {

            button.disabled = true;


            if (index === q.answer) {

                button.classList.add("correct");
            }


            if (
                answers[q.id] === index &&
                index !== q.answer
            ) {

                button.classList.add("wrong");
            }

        } else {

            button.onclick = function () {

                answers[q.id] = index;

                renderQuestion();
            };
        }


        optionsBox.appendChild(button);
    });


    renderPalette();


    document.getElementById("prevBtn").disabled =
        currentIndex === 0;


    document.getElementById("nextBtn").disabled =
        currentIndex === quiz.length - 1;
}


/* =========================
   PALETTE
========================= */

function renderPalette() {

    const palette =
        document.getElementById("palette");

    palette.innerHTML =
        "<h3>Question Palette</h3>";


    const grid =
        document.createElement("div");

    grid.className = "pal-grid";


    quiz.forEach((q, index) => {

        const button =
            document.createElement("button");

        button.className = "pal";

        button.textContent =
            index + 1;


        if (index === currentIndex) {

            button.classList.add("active");
        }


        if (
            answers[q.id] !== undefined
        ) {

            button.classList.add("done");
        }


        button.onclick = function () {

            currentIndex = index;

            renderQuestion();
        };


        grid.appendChild(button);
    });


    palette.appendChild(grid);
}


/* =========================
   PREVIOUS
========================= */

document.getElementById("prevBtn")
    .onclick = function () {

        if (currentIndex > 0) {

            currentIndex--;

            renderQuestion();
        }
    };


/* =========================
   NEXT
========================= */

document.getElementById("nextBtn")
    .onclick = function () {

        if (
            currentIndex < quiz.length - 1
        ) {

            currentIndex++;

            renderQuestion();
        }
    };


/* =========================
   SUBMIT
========================= */

document.getElementById("submitBtn")
    .onclick = function () {

        const confirmed =
            confirm(
                "क्या आप अपना test submit करना चाहते हैं?"
            );

        if (!confirmed) return;

        showResult();
    };


/* =========================
   RESULT
========================= */

function showResult() {

    let correct = 0;


    quiz.forEach(q => {

        if (
            answers[q.id] === q.answer
        ) {

            correct++;
        }
    });


    const attempted =
        Object.keys(answers).length;


    const wrong =
        attempted - correct;


    const unattempted =
        quiz.length - attempted;


    document.getElementById("quiz")
        .classList.add("hidden");


    document.getElementById("result")
        .classList.remove("hidden");


    document.getElementById("resultText")
        .innerHTML = `

        🎯 Test Result

        <div style="
            margin-top:25px;
            font-size:20px;
            line-height:2;
        ">

            <div>
                <b>Score:</b>
                ${correct} / ${quiz.length}
            </div>

            <div>
                🟢 Correct:
                ${correct}
            </div>

            <div>
                🔴 Wrong:
                ${wrong}
            </div>

            <div>
                ⚪ Unattempted:
                ${unattempted}
            </div>

            <div>
                📊 Attempted:
                ${attempted}
            </div>

        </div>

        <br>

        <button
            class="next"
            onclick="reviewAnswers()">
            👁️ Review Answers
        </button>

        <button
            class="prev"
            onclick="goHome()"
            style="margin-left:10px;">
            Choose Section
        </button>
    `;
}


/* =========================
   REVIEW
========================= */

function reviewAnswers() {

    reviewMode = true;

    currentIndex = 0;

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("quiz")
        .classList.remove("hidden");

    renderQuestion();
}
</script>
