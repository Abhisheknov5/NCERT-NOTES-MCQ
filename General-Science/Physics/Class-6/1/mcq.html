let current=0;
let selected=null;
let answers=Array(questions.length).fill(null);
let checked=Array(questions.length).fill(false);

const qEl=document.getElementById('question');
const oEl=document.getElementById('options');
const fEl=document.getElementById('feedback');
const counter=document.getElementById('counter');
const bar=document.getElementById('bar');
const prev=document.getElementById('prevBtn');
const check=document.getElementById('checkBtn');
const next=document.getElementById('nextBtn');

function render(){
if(current>=questions.length){
showResult();
return;
}

const q=questions[current];
selected=answers[current];

counter.textContent=`Question ${current+1} of ${questions.length}`;
bar.style.width=`${((current+1)/questions.length)*100}%`;
qEl.textContent=`${current+1}. ${q.q}`;
oEl.innerHTML='';
fEl.textContent='';

q.options.forEach((opt,i)=>{
const b=document.createElement('button');
b.className='option';
b.textContent=`${String.fromCharCode(65+i)}. ${opt}`;

if(selected===i)b.classList.add('selected');

if(checked[current]){
if(i===q.answer)b.classList.add('correct');
else if(selected===i)b.classList.add('wrong');
b.disabled=true;
}

b.onclick=()=>{
if(!checked[current]){
selected=i;
answers[current]=i;
render();
}
};

oEl.appendChild(b);
});

if(checked[current]){
fEl.textContent=
selected===q.answer
?'✓ Correct Answer!'
:'✗ Wrong Answer! Correct answer is: '+
String.fromCharCode(65+q.answer)+'. '+q.options[q.answer];
}

prev.disabled=current===0;
check.disabled=checked[current]||selected===null;
next.textContent=current===questions.length-1?'Finish Quiz':'Next →';
}

check.onclick=()=>{
if(selected===null)return;
checked[current]=true;
render();
};

next.onclick=()=>{
if(current===questions.length-1){
if(checked[current])showResult();
else alert('Please check your answer first.');
}else{
current++;
render();
}
};

prev.onclick=()=>{
if(current>0){
current--;
render();
}
};

function showResult(){
document.getElementById('quizBox').classList.add('hidden');
document.querySelector('.progress-box').classList.add('hidden');
document.getElementById('resultBox').classList.remove('hidden');

let score=0;

answers.forEach((a,i)=>{
if(a===questions[i].answer)score++;
});

document.getElementById('scoreText').innerHTML=
`🎉 Quiz Complete!<br>Your Score: ${score} / ${questions.length}`;
}

document.getElementById('restartBtn').onclick=()=>{
current=0;
selected=null;
answers=Array(questions.length).fill(null);
checked=Array(questions.length).fill(false);

document.getElementById('quizBox').classList.remove('hidden');
document.querySelector('.progress-box').classList.remove('hidden');
document.getElementById('resultBox').classList.add('hidden');

render();
};

render();
</script>
